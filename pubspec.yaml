name: calendar_vault_app
description: "Disguised Calendar App with Secret Media Vault (survives app reinstall)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Cryptography for military-grade AES-256 encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  # Media picking & file handling
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  # Video playback in vault
  video_player: ^2.8.6
  # Local preferences for decoy calendar
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_staggered_grid_view: ^0.7.0
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  mime: ^2.1.0
  http: ^1.2.0
  open_filex: ^4.7.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
